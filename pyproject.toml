[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagedserve"
version = "0.1.0"
description = "LLM inference engine: paged KV cache, continuous batching, prefix caching, chunked prefill, tensor and pipeline parallelism"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",   # tokenizer + correctness reference only, never used for inference
    "safetensors",
    "huggingface_hub",
    "fastapi",
    "uvicorn",
    "numpy",
]

[project.optional-dependencies]
gpu = ["flashinfer-python"]
bench = ["aiohttp", "matplotlib"]
test = ["pytest", "aiohttp"]

[tool.setuptools.packages.find]
include = ["engine*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "model: needs the Qwen3-0.6B-Base weights",
    "slow: takes more than about 30 seconds on CPU",
    "gpu: needs CUDA (and FlashInfer where noted)",
    "distributed: runs several processes (gloo on CPU, NCCL on GPU)",
]
